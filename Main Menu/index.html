<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App Main Menu</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="main">
      <div class="container">
        <header class="topbar">
          <div class="topbar-left">
            <button
              type="button"
              class="toggle-mode"
              aria-label="Toggle dark mode"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="32"
                height="32"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-moon-icon lucide-moon"
              >
                <path
                  d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"
                />
              </svg>

              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="32"
                height="32"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-sun-icon lucide-sun hidden"
              >
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2" />
                <path d="M12 20v2" />
                <path d="m4.93 4.93 1.41 1.41" />
                <path d="m17.66 17.66 1.41 1.41" />
                <path d="M2 12h2" />
                <path d="M20 12h2" />
                <path d="m6.34 17.66-1.41 1.41" />
                <path d="m19.07 4.93-1.41 1.41" />
              </svg>
            </button>

            <button type="button" class="themes" aria-label="Open themes">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="32"
                height="32"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-palette-icon lucide-palette"
              >
                <path
                  d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"
                />
                <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" />
                <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" />
                <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" />
                <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" />
              </svg>
            </button>

            <button
              type="button"
              class="difficulty"
              aria-label="Choose difficulty"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="32"
                height="32"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-star-icon lucide-star"
              >
                <path
                  d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"
                />
              </svg>
            </button>

            <div class="difficulty-container hidden">
              <span class="difficulty-label">Difficulty</span>

              <button
                type="button"
                class="difficulty-level"
                data-difficulty="easy"
              >
                <span>Easy</span>

                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="difficulty-level-star"
                  aria-hidden="true"
                >
                  <polygon
                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02
        12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
                  />
                </svg>
              </button>

              <button
                type="button"
                class="difficulty-level"
                data-difficulty="medium"
              >
                <span>Medium</span>

                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="difficulty-level-star"
                  aria-hidden="true"
                >
                  <polygon
                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02
        12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
                  />
                </svg>
              </button>

              <button
                type="button"
                class="difficulty-level"
                data-difficulty="hard"
              >
                <span>Hard</span>

                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="difficulty-level-star"
                  aria-hidden="true"
                >
                  <polygon
                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02
        12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
                  />
                </svg>
              </button>

              <button
                type="button"
                class="difficulty-level"
                data-difficulty="random"
              >
                <span>Random</span>

                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="difficulty-level-star"
                  aria-hidden="true"
                >
                  <polygon
                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02
        12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
                  />
                </svg>
              </button>
            </div>
          </div>

          <div class="total-coins topbar-right">
            <span class="coin-icon" aria-hidden="true">🪙</span>
            <span class="amount"> 100</span>
          </div>
        </header>

        <div class="label-container">
          <h1 class="app-name">QuizBlitz</h1>
          <button type="button" class="start-quiz" aria-label="Start quiz">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="64"
              height="64"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-play-icon lucide-play"
            >
              <path
                d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"
              />
            </svg>
          </button>
        </div>

        <div class="category-container">
          <div class="category-container__grid">
            <button
              type="button"
              class="quiz-category"
              data-category="entertainment"
            >
              <span class="icon" aria-hidden="true">🎮</span>
              <span class="category">Entertainment</span>
            </button>

            <button type="button" class="quiz-category" data-category="music">
              <span class="icon" aria-hidden="true">🎵</span>
              <span class="category">Music</span>
            </button>

            <button type="button" class="quiz-category" data-category="sports">
              <span class="icon" aria-hidden="true">⚽</span>
              <span class="category">Sports</span>
            </button>

            <button type="button" class="quiz-category" data-category="science">
              <span class="icon" aria-hidden="true">🧪</span>
              <span class="category">Science</span>
            </button>

            <button type="button" class="quiz-category" data-category="history">
              <span class="icon" aria-hidden="true">🏛️</span>
              <span class="category">History</span>
            </button>

            <button
              type="button"
              class="quiz-category"
              data-category="geography"
            >
              <span class="icon" aria-hidden="true">🌍</span>
              <span class="category">Geography</span>
            </button>

            <button type="button" class="quiz-category" data-category="food">
              <span class="icon" aria-hidden="true">🍉</span>
              <span class="category">Food</span>
            </button>

            <button
              type="button"
              class="quiz-category"
              data-category="literature"
            >
              <span class="icon" aria-hidden="true">📜</span>
              <span class="category">Literature</span>
            </button>

            <button type="button" class="quiz-category" data-category="cinema">
              <span class="icon" aria-hidden="true">🍿</span>
              <span class="category">Cinema</span>
            </button>

            <button type="button" class="quiz-category" data-category="art">
              <span class="icon" aria-hidden="true">🎭</span>
              <span class="category">Art</span>
            </button>

            <button
              type="button"
              class="quiz-category"
              data-category="technology"
            >
              <span class="icon" aria-hidden="true">🤖</span>
              <span class="category">Technology</span>
            </button>

            <button type="button" class="quiz-category" data-category="nature">
              <span class="icon" aria-hidden="true">🦁</span>
              <span class="category">Nature</span>
            </button>

            <button type="button" class="quiz-category" data-category="gaming">
              <span class="icon" aria-hidden="true">🕹️</span>
              <span class="category">Gaming</span>
            </button>

            <button type="button" class="quiz-category" data-category="space">
              <span class="icon" aria-hidden="true">🚀</span>
              <span class="category">Space</span>
            </button>

            <button
              type="button"
              class="quiz-category"
              data-category="mythology"
            >
              <span class="icon" aria-hidden="true">🐉</span>
              <span class="category">Mythology</span>
            </button>

            <button
              type="button"
              class="quiz-category"
              data-category="pop-culture"
            >
              <span class="icon" aria-hidden="true">🕶️</span>
              <span class="category">Pop Culture</span>
            </button>

            <button type="button" class="quiz-category" data-category="fashion">
              <span class="icon" aria-hidden="true">👠</span>
              <span class="category">Fashion</span>
            </button>

            <button type="button" class="quiz-category" data-category="random">
              <span class="icon" aria-hidden="true">🎲</span>
              <span class="category">Random</span>
            </button>
          </div>
        </div>
      </div>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
