<!doctype html>
<html data-theme="forest" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Main Menu</title>
    <link rel="stylesheet" href="../styles/themes.css" />
    <link rel="stylesheet" href="../styles/rank.css" />
    <link rel="stylesheet" href="style-copy.css" />
  </head>
  <body>
    <div class="wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button
            type="button"
            class="topbar-left__btn sound-button"
            aria-label="Open sounds"
            aria-expanded="false"
            aria-controls="sounds-dropdown"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-volume2-icon lucide-volume-2"
            >
              <path
                d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"
              />
              <path d="M16 9a5 5 0 0 1 0 6" />
              <path d="M19.364 18.364a9 9 0 0 0 0-12.728" />
            </svg>
          </button>

          <button
            type="button"
            class="topbar-left__btn settings-button hidden"
            aria-label="Open settings"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-settings-icon lucide-settings"
            >
              <path
                d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>

          <div id="sounds-dropdown" class="sounds-dropdown hidden">
            <h3 class="sounds-dropdown__label">Sounds</h3>
            <div class="sounds-music">
              <span class="sounds-music__label">Music</span>
              <button
                type="button"
                class="sounds-music__toggle"
                aria-label="Toggle music"
                aria-pressed="true"
              >
                <span></span>
              </button>
            </div>

            <div class="sounds-fx">
              <span class="sounds-fx__label">SFX</span>
              <button
                type="button"
                class="sounds-fx__toggle"
                aria-label="Toggle sound effects"
                aria-pressed="true"
              >
                <span></span>
              </button>
            </div>
          </div>
        </div>

        <div class="topbar-right">
          <div class="topbar-right__element total-coins">
            <span class="coin-icon coins" aria-hidden="true">🪙</span>
            <span class="coin-amount coins" aria-live="polite">100</span>
          </div>

          <div class="topbar-right__element user-avatar">
            <button
              type="button"
              class="avatar-button"
              aria-label="Open profile menu"
              aria-expanded="false"
              aria-controls="profile-dropdown"
            >
              <img
                src="../Images/avatar.svg"
                alt="User avatar image"
                class="dropdown-top__avatar"
              />
            </button>

            <div id="profile-dropdown" class="profile-dropdown hidden">
              <div class="dropdown-top">
                <img
                  src="../Images/avatar.svg"
                  alt="User avatar image"
                  class="dropdown-top__avatar"
                />

                <div class="user-info">
                  <span class="dropdown-top__username">Timur Bagirov</span>
                  <span class="dropdown-top__email">example@gmail.com</span>
                </div>
              </div>

              <div class="dropdown-top__ranking" data-rank="diamond">
                <div class="ranking-label">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="#FFD700"
                    stroke="#FFD700"
                    stroke-width="3"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-crown-icon lucide-crown"
                  >
                    <path
                      d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"
                    />
                    <path d="M5 21h14" />
                  </svg>
                  Ranking
                </div>
                <span class="ranking-name">Amateur</span>
              </div>

              <div class="dropdown-bottom">
                <button type="button" class="dropdown-bottom__section profile">
                  <span class="dropdown-bottom__icon profile-icon"
                    ><svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-user-round-icon lucide-user-round"
                    >
                      <circle cx="12" cy="8" r="5" />
                      <path d="M20 21a8 8 0 0 0-16 0" />
                    </svg>
                  </span>

                  <span class="dropdown-bottom__label profile-label"
                    >My Profile</span
                  >
                </button>

                <button type="button" class="dropdown-bottom__section settings">
                  <span class="dropdown-bottom__icon settings-icon"
                    ><svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-settings-icon lucide-settings"
                    >
                      <path
                        d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
                      />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                  </span>

                  <span class="dropdown-bottom__label settings-label"
                    >Settings</span
                  >
                </button>

                <button
                  type="button"
                  class="dropdown-bottom__section darkmode"
                  aria-label="Switch to dark mode"
                  aria-pressed="false"
                >
                  <div class="switch-left">
                    <span class="dropdown-bottom__icon darkmode-icon"
                      ><svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="lucide lucide-moon-icon lucide-moon"
                      >
                        <path
                          d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"
                        />
                      </svg>
                    </span>

                    <span class="dropdown-bottom__icon lightmode-icon"
                      ><svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="lucide lucide-sun-icon lucide-sun"
                      >
                        <circle cx="12" cy="12" r="4" />
                        <path d="M12 2v2" />
                        <path d="M12 20v2" />
                        <path d="m4.93 4.93 1.41 1.41" />
                        <path d="m17.66 17.66 1.41 1.41" />
                        <path d="M2 12h2" />
                        <path d="M20 12h2" />
                        <path d="m6.34 17.66-1.41 1.41" />
                        <path d="m19.07 4.93-1.41 1.41" />
                      </svg>
                    </span>

                    <span class="dropdown-bottom__label darkmode-label"
                      >Dark Mode</span
                    >
                    <span class="dropdown-bottom__label lightmode-label hidden"
                      >Light Mode</span
                    >
                  </div>

                  <div class="switch-right">
                    <div
                      class="dropdown-bottom__element toggle"
                      aria-hidden="true"
                    >
                      <span></span>
                    </div>
                  </div>
                </button>

                <button type="button" class="dropdown-bottom__section logout">
                  <span class="dropdown-bottom__icon logout-icon"
                    ><svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-log-out-icon lucide-log-out"
                    >
                      <path d="m16 17 5-5-5-5" />
                      <path d="M21 12H9" />
                      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    </svg>
                  </span>

                  <span class="dropdown-bottom__label logout-label"
                    >Logout</span
                  >
                </button>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="main-container">
        <div class="logo">
          <span class="logo-img">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-brain-icon lucide-brain"
            >
              <path d="M12 18V5" />
              <path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4" />
              <path d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5" />
              <path d="M17.997 5.125a4 4 0 0 1 2.526 5.77" />
              <path d="M18 18a4 4 0 0 0 2-7.464" />
              <path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517" />
              <path d="M6 18a4 4 0 0 1-2-7.464" />
              <path d="M6.003 5.125a4 4 0 0 0-2.526 5.77" />
            </svg>
          </span>
          <h1 class="logo-label">QuizSphere</h1>
        </div>

        <nav class="main-menu" aria-label="Main menu">
          <button
            type="button"
            class="main-menu__special play-section"
            aria-label="Open play section"
          >
            <span class="main-menu__icon play-icon"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                width="96"
                height="96"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-play-icon lucide-play"
              >
                <path
                  d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"
                />
              </svg>
            </span>

            <span class="main-menu__label play-label">PLAY</span>
          </button>

          <button
            type="button"
            class="main-menu__section statistics-section"
            aria-label="Open statistics section"
          >
            <span class="main-menu__icon statistics-icon"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                width="36"
                height="36"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-chart-pie-icon lucide-chart-pie"
              >
                <path
                  d="M21 12c.552 0 1.005-.449.95-.998a10 10 0 0 0-8.953-8.951c-.55-.055-.998.398-.998.95v8a1 1 0 0 0 1 1z"
                />
                <path d="M21.21 15.89A10 10 0 1 1 8 2.83" />
              </svg>
            </span>

            <span class="main-menu__label statistics-label">Statistics</span>
          </button>

          <a
            href="../Customization/index.html"
            class="main-menu__section customization-section"
            aria-label="Open customization section"
          >
            <span class="main-menu__icon customization-icon"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                width="36"
                height="36"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-palette-icon lucide-palette"
              >
                <path
                  d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"
                />
                <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" />
                <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" />
                <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" />
                <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" />
              </svg>
            </span>

            <span class="main-menu__label customization-label"
              >Customization</span
            >
          </a>

          <button
            type="button"
            class="main-menu__section achievements-section"
            aria-label="Open achievements"
          >
            <span class="main-menu__icon achievements-icon"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                width="36"
                height="36"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-trophy-icon lucide-trophy"
              >
                <path
                  d="M10 14.66v1.626a2 2 0 0 1-.976 1.696A5 5 0 0 0 7 21.978"
                />
                <path
                  d="M14 14.66v1.626a2 2 0 0 0 .976 1.696A5 5 0 0 1 17 21.978"
                />
                <path d="M18 9h1.5a1 1 0 0 0 0-5H18" />
                <path d="M4 22h16" />
                <path
                  d="M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z"
                />
                <path d="M6 9H4.5a1 1 0 0 1 0-5H6" />
              </svg>
            </span>

            <span class="main-menu__label achievements-label"
              >Achievements</span
            >
          </button>

          <button
            type="button"
            class="main-menu__section shop-section"
            aria-label="Open Shop"
          >
            <span class="main-menu__icon shop-icon"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                width="36"
                height="36"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-store-icon lucide-store"
              >
                <path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5" />
                <path
                  d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244"
                />
                <path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05" />
              </svg>
            </span>

            <span class="main-menu__label shop-label">Shop</span>
          </button>
        </nav>
      </main>
    </div>
    <script type="module" src="script-copy.js"></script>
  </body>
</html>
