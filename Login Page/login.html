<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="logo">
      <img src="../Images/brain.svg" class="brain-img" alt="Brain Icon" />
      <h1 class="app-name">QuizSphere</h1>
    </div>

    <main class="main-container">
      <form class="form-container" novalidate>
        <h1 class="label">Login</h1>
        <p class="message">Welcome back! Please log in to your account.</p>

        <div class="input-fields">
          <div class="email-field">
            <input
              type="email"
              id="email"
              class="input-types"
              name="email"
              placeholder="example@gmail.com"
              autocomplete="email"
              required
            />

            <i class="email-icon icon"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-mail-icon lucide-mail"
              >
                <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" />
                <rect x="2" y="4" width="20" height="16" rx="2" /></svg
            ></i>
          </div>

          <div class="password-field">
            <input
              type="password"
              id="password"
              class="input-types"
              name="password"
              placeholder="password"
              autocomplete="current-password"
              required
            />

            <button type="button" class="password-icon icon">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-eye-off-icon lucide-eye-off"
              >
                <path
                  d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"
                />
                <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" />
                <path
                  d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"
                />
                <path d="m2 2 20 20" />
              </svg>
            </button>
          </div>

          <div class="remember-field">
            <input
              type="checkbox"
              id="remember"
              name="remember"
              value="accepted"
            />

            <label for="remember">Remember me</label>
          </div>

          <p id="invalidInputError" class="error hidden">
            Invalid email or password. Please try again.
          </p>

          <p id="missingInputsError" class="error hidden">
            Please enter both your email and password.
          </p>
        </div>

        <button type="submit" class="login-btn">Login</button>
        <span class="no-account"
          >Don't have an account?
          <span class="sign-up"
            ><a href="../Sign Up Page/sign-up.html">Sign Up</a></span
          ></span
        >
      </form>
    </main>
    <script type="module" src="login.js" defer></script>
  </body>
</html>
