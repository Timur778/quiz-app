<!doctype html>
<html
  lang="en"
  class="preload"
  data-theme="default"
  data-mode="light"
  data-style="default"
  data-accent="theme-default"
  data-background="none"
>
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #f1f5f9;
      }

      .preload *,
      .preload *::before,
      .preload *::after {
        transition: none !important;
      }
    </style>

    <script>
      try {
        const storedData = JSON.parse(localStorage.getItem("database"));

        const database = storedData?.[0];

        const activeUser = database?.users?.find(
          (user) => user.userId === database?.activeSession?.userId,
        );

        const customization = activeUser?.customization;

        if (customization) {
          document.documentElement.dataset.theme =
            customization.theme ?? "default";

          document.documentElement.dataset.mode = customization.mode ?? "light";

          document.documentElement.dataset.style =
            customization.style ?? "default";

          document.documentElement.dataset.accent =
            customization.accent ?? "theme-default";

          document.documentElement.dataset.background =
            customization.background ?? "none";
        }
      } catch (error) {
        console.error("Could not apply initial customization.", error);
      }
    </script>

    <title>Knowledge Valley | QuizSphere</title>

    <!-- Shared foundation -->
    <link rel="stylesheet" href="../../../styles/reset.css" />

    <link rel="stylesheet" href="../../../styles/tokens.css" />

    <link rel="stylesheet" href="../../../styles/themes.css" />

    <link rel="stylesheet" href="../../../styles/accents.css" />

    <link rel="stylesheet" href="../../../styles/element-styles.css" />

    <link rel="stylesheet" href="../../../styles/backgrounds.css" />

    <!-- Shared internal-page layout -->
    <link rel="stylesheet" href="../../../styles/shared-layout.css" />

    <!-- Shared campaign-world layout -->
    <link rel="stylesheet" href="../../../styles/campaign-world.css" />

    <!-- World-specific palettes and backgrounds -->
    <link rel="stylesheet" href="../../../styles/worlds.css" />

    <!-- Knowledge Valley refinements -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="wrapper campaign-world-page" data-world="knowledge-valley">
      <header class="topbar campaign-topbar">
        <div class="topbar-left">
          <a
            href="../../Play Modes/Campaign/campaign.html"
            class="back-button"
            data-sound="click"
            data-navigation="true"
            aria-label="Return to Campaign worlds"
          >
            <span class="back-button__icon" aria-hidden="true">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="m12 19-7-7 7-7" />
                <path d="M19 12H5" />
              </svg>
            </span>

            <span class="back-button__label">Back</span>
          </a>
        </div>

        <div class="topbar-right">
          <a
            href="../../../Main Menu/index.html"
            class="main-menu-button"
            data-sound="click"
            data-navigation="true"
            aria-label="Return to Main Menu"
          >
            <span class="main-menu-button__icon" aria-hidden="true">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-house-icon lucide-house"
              >
                <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
                <path
                  d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
                />
              </svg>
            </span>

            <span class="main-menu-button__label">Main Menu</span>
          </a>
        </div>
      </header>

      <main class="campaign-world-content">
        <div class="world-heading">
          <span class="world-number">World 1</span>

          <h1 class="world-title">Knowledge Valley</h1>

          <p class="world-description">
            Complete every level and continue your journey through the valley.
          </p>
        </div>

        <section
          class="level-map"
          aria-label="Knowledge Valley levels"
        ></section>
      </main>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
